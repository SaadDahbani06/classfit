[browser]
# Do not send Streamlit usage statistics: the site promises not to track students.
gatherUsageStats = false

[client]
# Students don't need Streamlit's developer menu or the "Deploy" button.
toolbarMode = "minimal"

# Serves static/fonts, so the fonts come from this app and it still loads nothing
# from third parties (and the site works with no internet at all).
[server]
enableStaticServing = true

# ClassFit design (warm light page, Marist red accent).
# Component styles live in app.py (STYLE); these set Streamlit's base theme.
[theme]
base = "light"
primaryColor = "#C8102E"
backgroundColor = "#FBF8F6"
secondaryBackgroundColor = "#F4EFEC"
textColor = "#1F1A1C"
linkColor = "#A00D25"
borderColor = "#E7E0DC"
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
headingFont = "'Bricolage Grotesque', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
dataframeBorderColor = "#E7E0DC"
dataframeHeaderBackgroundColor = "#F4EFEC"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-wght-normal.woff2"
weight = "100 900"

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/fonts/bricolage-grotesque-latin-wght-normal.woff2"
weight = "200 800"

[theme.sidebar]
backgroundColor = "#F4EFEC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F1A1C"
borderColor = "#E7E0DC"
